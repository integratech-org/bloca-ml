services:
  fastapi:
    build:
      context: .
      # Build the production stage from the multi-stage Dockerfile.
      target: production
    image: bloca-ml:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - fastapi-data:/app/ml_models
    restart: unless-stopped

volumes:
  fastapi-data:
