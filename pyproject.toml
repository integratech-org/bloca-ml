[project]
name = "bloca-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ai-edge-litert>=2.4.1",
  "fastapi[standard]>=0.139.2",
  "huggingface-hub>=2.5.0",
  "joblib>=1.6.0",
  "pillow>=13.0.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = ["pre-commit>=4.6.1", "ruff>=0.16.0"]

[tool.fastapi]
entrypoint = "bloca_ml.main:app"

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"
